    <link rel="stylesheet" href="flashcard_css.css" type="text/css">

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-192.png">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');

<body>

<div class="container">

    <div class="top-bar">
        <span class="app-title">MemoRise</span>
        <div class="top-actions">
            <!-- ログインボタンとステータスを追加 -->
            <button class="shuffle-btn" id="authBtn" onclick="toggleAuth()">🔑 ログイン</button>
            <button class="shuffle-btn" onclick="shuffleCards()">🔀 シャッフル</button>
            <button class="shuffle-btn" onclick="resetAll()">🔄 最初から</button>
        </div>
    </div>
    <div id="userStatus" style="font-size: 12px; text-align: right; color: #666; margin-bottom: 5px; padding-right: 10px;">
        未ログイン（端末保存）
    </div>

    <!-- 上部プログレスバー -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <div class="card" id="card" onclick="flipCard()">
        <div class="card-type" id="cardType">英語</div>
        <div class="word" id="displayWord"></div>
        <div class="sub-text" id="subText">クリックして日本語訳を表示</div>
    </div>

    <div class="check-buttons">
        <button class="check-btn bad-btn" onclick="markWord(false)">まだ</button>
        <button class="check-btn good-btn" onclick="markWord(true)">覚えた</button>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prevBtn" onclick="prevWord()">前へ</button>
        <button class="audio-btn" id="audioBtn" onclick="playAudio(event)">🔊 発音</button>
        <span class="progress" id="progress">1 / 100</span>
        <button class="nav-btn" id="nextBtn" onclick="nextWord()">次へ</button>
    </div>

    <!-- 画面最下部に固定配置 -->
    <div class="app-switcher">
        <a href="index.html" class="nav-tab">🏠 ホーム</a>
        <a href="flashcard.html" class="nav-tab active">📖 単語帳</a>
        <a href="calendar.html" class="nav-tab">📅 カレンダー</a>
    </div>
</div>

{ en: "overtime", ja: "残業、時間外に" }

    let activeList = [];
    let currentIndex = 0;
    let isShowingJapanese = false;
    let currentUser = null;
    let unsubscribeFirestore = null;

    // 2. ログイン／ログアウトの切り替え処理
    async function toggleAuth() {
    if (currentUser) {
        // ログイン中の場合はログアウト
        await signOut(auth);
    } else {
        // 未ログインの場合、メールアドレスとパスワードの入力を求める
        const email = prompt("メールアドレスを入力してください:");
        if (!email) return;

        const password = prompt("パスワードを入力してください（6文字以上）:");
        if (!password) return;

        try {
            // まずはログインを試みる
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            // アカウントが存在しない・パスワード誤り等の場合、新規作成を促す
            const createAccount = confirm("ログインできませんでした。このメールアドレスで新規アカウントを作成しますか？");
            if (createAccount) {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("アカウントを作成し、ログインしました！");
                } catch (createError) {
                    alert("アカウント作成エラー: " + createError.message);
                }
            }
        }
    }
}

    // 3. ログイン状態の監視と同期制御
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const authBtn = document.getElementById('authBtn');
        const userStatus = document.getElementById('userStatus');

        if (unsubscribeFirestore) {
            unsubscribeFirestore(); // 以前のFirestore監視を解除
        }

        if (user) {
            authBtn.textContent = "🚪 ログアウト";
            userStatus.textContent = `同期中: ${user.displayName || user.email}`;

            const docRef = doc(db, "users", user.uid);

            // リアルタイムでクラウドデータを監視・受動反映
            unsubscribeFirestore = onSnapshot(docRef, async (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    activeList = data.activeList || [];
                    currentIndex = data.currentIndex || 0;
                } else {
                    // クラウドに初回保存の場合、ローカル保存中の進捗を引き継ぐ
                    loadLocalProgress();
                    await saveProgress();
                }
                updateCardUI();
            });
        } else {
            authBtn.textContent = "🔑 ログイン";
            userStatus.textContent = "未ログイン（端末保存）";
            loadLocalProgress();
            updateCardUI();
        }
    });

    // 4. データ読み出し処理（ローカルストレージ）
    function loadLocalProgress() {
        const savedData = localStorage.getItem('memorise_active_list');
        const savedIndex = localStorage.getItem('memorise_current_index');
        
        if (savedData) {
            try {
                activeList = JSON.parse(savedData);
                currentIndex = savedIndex !== null ? parseInt(savedIndex, 10) : 0;
                if (currentIndex >= activeList.length && activeList.length > 0) {
                    currentIndex = activeList.length - 1;
                }
            } catch (e) {
                activeList = [...rawWordList];
                currentIndex = 0;
            }
        } else {
            activeList = [...rawWordList];
            currentIndex = 0;
        }
    }

    // 5. データ保存処理（ログイン時はFirestore、未ログイン時はlocalStorage）
    async function saveProgress() {
        if (currentUser) {
            const docRef = doc(db, "users", currentUser.uid);
            await setDoc(docRef, {
                activeList: activeList,
                currentIndex: currentIndex,
                updatedAt: new Date()
            });
        } else {
            localStorage.setItem('memorise_active_list', JSON.stringify(activeList));
            localStorage.setItem('memorise_current_index', currentIndex.toString());
        }
    }

    // UI表示更新関数
    function updateCardUI() {
        const cardEl = document.getElementById('card');

        if (activeList.length === 0) {
            document.getElementById('displayWord').textContent = "🎉 すべて覚えました！";
            document.getElementById('cardType').textContent = "完了";
            document.getElementById('subText').textContent = "「最初から」ボタンで復習できます";
            document.getElementById('progress').textContent = "完了";
            document.getElementById('progressBarFill').style.width = "100%";
            document.getElementById('prevBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('audioBtn').disabled = true;
            cardEl.classList.remove('is-japanese');
            return;
        }

        document.getElementById('audioBtn').disabled = false;
        const item = activeList[currentIndex];
        const displayWordEl = document.getElementById('displayWord');
        const cardTypeEl = document.getElementById('cardType');
        const subTextEl = document.getElementById('subText');

        if (isShowingJapanese) {
            cardTypeEl.textContent = "日本語訳";
            displayWordEl.textContent = item.ja;
            displayWordEl.classList.add('translation');
            subTextEl.textContent = "クリックして英単語を表示";
            cardEl.classList.add('is-japanese');
        } else {
            cardTypeEl.textContent = "英語";
            displayWordEl.textContent = item.en;
            displayWordEl.classList.remove('translation');
            subTextEl.textContent = "クリックして日本語訳を表示";
            cardEl.classList.remove('is-japanese');
        }

        document.getElementById('progress').textContent = `${currentIndex + 1} / ${activeList.length}`;
        const percentage = ((currentIndex + 1) / activeList.length) * 100;
        document.getElementById('progressBarFill').style.width = `${percentage}%`;

        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === activeList.length - 1;
    }

    // 6. 操作関数群（HTMLのonclickイベントから呼べるようにwindowに登録）
    window.toggleAuth = toggleAuth;

    window.flipCard = function() {
        if (activeList.length === 0) return;
        isShowingJapanese = !isShowingJapanese;
        updateCardUI();
    };

    window.markWord = async function(isRemembered) {
        if (activeList.length === 0) return;

        if (isRemembered) {
            activeList.splice(currentIndex, 1);
            if (currentIndex >= activeList.length && currentIndex > 0) {
                currentIndex--;
            }
        } else {
            if (currentIndex < activeList.length - 1) {
                currentIndex++;
            }
        }
        
        isShowingJapanese = false;
        await saveProgress();
        updateCardUI();
    };

    window.playAudio = function(event) {
        if (event) event.stopPropagation();
        if (activeList.length === 0) return;
        const currentItem = activeList[currentIndex];
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentItem.en);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    };

    window.nextWord = async function() {
        if (currentIndex < activeList.length - 1) {
            currentIndex++;
            isShowingJapanese = false;
            await saveProgress();
            updateCardUI();
        }
    };

    window.prevWord = async function() {
        if (currentIndex > 0) {
            currentIndex--;
            isShowingJapanese = false;
            await saveProgress();
            updateCardUI();
        }
    };

    window.shuffleCards = async function() {
        for (let i = activeList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeList[i], activeList[j]] = [activeList[j], activeList[i]];
        }
        currentIndex = 0;
        isShowingJapanese = false;
        await saveProgress();
        updateCardUI();
    };

    window.resetAll = async function() {
        localStorage.removeItem('memorise_active_list');
        localStorage.removeItem('memorise_current_index');
        
        activeList = [...rawWordList];
        currentIndex = 0;
        isShowingJapanese = false;

        if (currentUser) {
            const docRef = doc(db, "users", currentUser.uid);
            await deleteDoc(docRef); // クラウド側の保存情報もクリア
        }

        await saveProgress();
        updateCardUI();
    };

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') window.nextWord();
        if (e.key === 'ArrowLeft') window.prevWord();
        if (e.key === ' ') {
            e.preventDefault();
            window.flipCard();
        }
    });

    // 初期起動処理
    loadLocalProgress();
    updateCardUI();
</script>
